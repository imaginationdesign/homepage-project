<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Contact | My First Website</title>
  <meta name="description" content="このサイトへのお問い合わせフォームページです。ご質問やご感想など、お気軽にメッセージをお送りいただけます。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      background-color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 0;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }
    nav {
      background-color: #1a2b4a;
      width: 100%;
      padding: 16px 0;
      margin-bottom: 32px;
    }
    .nav-inner {
      max-width: 800px;
      margin: 0 auto;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 16px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    h1 {
      margin-bottom: 16px;
    }
    .subtitle {
      font-size: 14px;
      color: #888888;
      margin: 0 0 24px;
    }
    p {
      color: #444444;
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .contact-form {
      box-sizing: border-box;
      max-width: 480px;
      margin: 0 auto 64px;
      padding: 24px;
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-align: left;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #1a2b4a;
      font-weight: bold;
      font-size: 14px;
    }
    .form-group input,
    .form-group textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      color: #444444;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    .form-group textarea {
      min-height: 140px;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4a90e2;
    }
    .submit-button {
      display: inline-block;
      width: 100%;
      padding: 10px 24px;
      background-color: #4a90e2;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .submit-button:hover {
      background-color: #3a7bc8;
    }
    footer {
      background-color: #1a2b4a;
      color: #ffffff;
      text-align: center;
      padding: 24px 0;
      font-size: 12px;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html#top">Home</a>
      <a href="about.html">About</a>
      <a href="works.html">Works</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
  <div class="container" id="top">
    <h1>お問い合わせ</h1>
    <p class="subtitle">ご質問・ご感想などお気軽にどうぞ</p>

    <form class="contact-form">
      <div class="form-group">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" placeholder="山田 太郎">
      </div>
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください"></textarea>
      </div>
      <button type="button" class="submit-button">送信する</button>
    </form>
  </div>
  <footer>
    &copy; 2026 My Site. All Rights Reserved.
  </footer>
</body>
</html>
